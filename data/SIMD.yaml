  5: Airliner
  6: Propeller_Aircraft
  7: Trainer_Aircraft
  8: Chartered_Aircraft
  9: Fighter_Aircraft
  10: Others
  11: Stair_Truck
  12: Pushback_Truck
  13: Helicopter
  14: Boat
